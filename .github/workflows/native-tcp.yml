name: Native TCP without VISA
on: [pull_request]
permissions:
  contents: read
jobs:
  no-visa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install . pytest pytest-timeout
      - run: python -c "import importlib.util; assert importlib.util.find_spec('pyvisa') is None"
      - run: python -m pytest tests/test_native_tcp.py
