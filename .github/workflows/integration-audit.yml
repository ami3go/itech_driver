name: Ordered offline integration audit
on:
  pull_request:
    paths:
      - 'tools/audit_integration.py'
      - '.github/workflows/integration-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merge-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Freeze and audit selected PR refs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python tools/audit_integration.py --base "$BASE_SHA" --output integration-audit.json --archive integrated-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-audit
          path: |
            integration-audit.json
            integrated-source.zip
          if-no-files-found: error

  integrated-regression:
    needs: merge-audit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: integration-audit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify snapshot and extract
        shell: bash
        run: |
          python -c "import hashlib,json,pathlib; p=pathlib.Path('integrated-source.zip'); r=json.loads(pathlib.Path('integration-audit.json').read_text()); assert r['status']=='CLEAN_MERGE_AUDIT'; assert hashlib.sha256(p.read_bytes()).hexdigest()==r['archive_sha256']; print('Integrated tree:',r['audit_tree'])"
          python -m zipfile -e integrated-source.zip integrated
      - name: Install and run integrated offline regressions
        working-directory: integrated
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q src
          python -m pytest --collect-only -q -m "not hardware"
          python -m pytest -m "not hardware" --junitxml=integrated-results.xml
      - name: Build integrated wheel
        working-directory: integrated
        run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            integrated/integrated-results.xml
            integrated/dist/
