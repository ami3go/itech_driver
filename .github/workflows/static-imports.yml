name: Static checks and public imports
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  static-imports:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . ruff==0.11.13 mypy==1.16.1
      - run: python -m ruff check --select F821,F822,F823 src/itech_driver
      - run: python -m mypy --follow-imports=silent --disallow-untyped-defs src/itech_driver/identity.py src/itech_driver/utils/ulogger.py
      - run: python tools/check_public_imports.py
