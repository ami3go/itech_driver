name: Offline driver CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: python -m pytest --junitxml=interface-results.xml
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-results-${{ matrix.os }}-${{ matrix.python }}
          path: interface-results.xml
