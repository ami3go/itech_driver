[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itech-itm3900d-driver"
version = "0.2.0"
description = "ITECH IT-M3900D SCPI driver built on scpi-driver-core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scpi-driver-core @ git+https://github.com/ami3go/scpi-driver-core.git@1e03b6837f96f200dc28233490639f2f080e1791",
]

[project.urls]
Repository = "https://github.com/ami3go/itech_driver"
Issues = "https://github.com/ami3go/itech_driver/issues"

[project.optional-dependencies]
visa = ["pyvisa>=1.14"]
serial = ["pyserial>=3.5"]
test = ["pytest>=8", "pytest-timeout>=2.4,!=2.5.0", "hypothesis>=6", "pyvisa-sim>=0.7.1", "pyserial>=3.5", "pytest-cov>=5"]
dev = ["pytest>=8", "pytest-timeout>=2.4,!=2.5.0", "hypothesis>=6", "pyvisa-sim>=0.7.1", "pyserial>=3.5", "pytest-cov>=5", "build>=1.2"]

[project.scripts]
itech-discover = "itech_driver.cli:discover_instruments"
itech-control = "itech_driver.cli:control_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not hardware'"
timeout = 30
session_timeout = 600
markers = [
    "integration: local integration test",
    "visa_sim: PyVISA-sim test",
    "property: generated property test",
    "hardware: requires physical instrument",
]
