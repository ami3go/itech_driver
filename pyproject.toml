[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "itm3900d"
version = "0.1.0"
description = "Production-intent PyVISA driver for ITECH IT-M3900D DC power supplies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Generated by ChatGPT"}]
keywords = ["ITECH", "IT-M3900D", "PyVISA", "SCPI", "power-supply", "instrument-control"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = ["pyvisa>=1.13"]

[project.optional-dependencies]
pyvisa-py = ["pyvisa-py>=0.7"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.7"]
numpy = ["numpy>=1.24"]

[tool.hatch.build.targets.wheel]
packages = ["itm3900d"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
