spec: "1.0"
devices:
  itech:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    dialogues:
      - q: "SOUR:VOLT? MIN"
        r: "0"
      - q: "SOUR:VOLT? MAX"
        r: "30"
      - q: "*IDN?"
        r: "ITECH,IT-M3900D,SIM001,1.0"
      - q: "OUTP:STAT OFF"
      - q: "OUTP:STAT?"
        r: "OFF"
    properties:
      voltage:
        default: 1.0
        getter:
          q: "SOUR:VOLT?"
          r: "{:.1f}"
        setter:
          q: "SOUR:VOLT {:.1f}"
        specs:
          min: 0.0
          max: 30.0
          type: float
resources:
  GPIB::9::INSTR:
    device: itech
